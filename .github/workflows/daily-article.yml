name: Daily NEET Article

on:
  schedule:
    - cron: '57 0 * * *'
  workflow_dispatch:

jobs:
  generate-article:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install anthropic
      - name: Generate article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && python3 -c "import json,sys,datetime as d; t=(d.datetime.utcnow()+d.timedelta(hours=5,minutes=30)).strftime('%Y-%m-%d'); sys.exit(0 if any(a.get('date')==t for a in json.load(open('articles.json'))) else 1)"; then
            echo "An article for today (IST) is already published - skipping this scheduled run."
          else
            python scripts/generate_article.py
          fi
      - name: Commit and push new article
        run: |
          git config user.name "NEETSuccess Bot"
          git config user.email "bot@neetsuccess.com"
          git add -A
          git diff --staged --quiet || git commit -m "Daily article: $(date +%Y-%m-%d)"
          git push

      - name: Tell Bing and IndexNow about new pages
        if: success()
        run: |
          sleep 60
          python scripts/seo_boost.py indexnow-new || true
